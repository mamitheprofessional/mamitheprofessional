<svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0f0a"/>
    <stop offset="100%" stop-color="#12160f"/>
  </linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <mask id="sweepMask" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="660">
    <rect x="0" y="0" width="760" height="660" fill="black"/>
    <rect x="0" y="0" height="660" width="0" fill="white">
      <animate id="sweep" attributeName="width" values="0;760" dur="2.6s" calcMode="spline" keySplines="0.42 0 0.3 1" fill="freeze"/>
    </rect>
  </mask>
  <mask id="statusMask" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="660">
    <rect x="0" y="0" width="760" height="660" fill="black"/>
    <rect x="0" y="608" height="30" width="0" fill="white">
      <animate attributeName="width" begin="sweep.end+0.25s" values="0;600" dur="1.1s" fill="freeze"/>
    </rect>
  </mask>
</defs>

